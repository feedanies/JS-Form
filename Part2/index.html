<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Settings</h1>

      <form name="myForm">
        <div class="section">
          <div class="title">Account</div>
          <div class="fields">
            <div class="form-item">
              <label for="fullname">Full Name</label>
              <input type="text" id="fullname" class="medium" />
            </div>
            <div class="form-item">
              <label for="email">Email Address</label>
              <input type="email" id="email" class="medium" />
            </div>
            <div class="form-item">
              <label for="phone">Phone Number</label>
              <input type="text" id="phone" class="small" />
            </div>
          </div>
        </div>

        <div class="section">
          <div class="title">Billing</div>
          <div class="fields">
            <div class="row">
              <div class="form-item">
                <label for="plan">Plan</label>
                <input type="text" id="plan" />
              </div>
              <div class="form-item">
                <label for="billing">Billing Interval</label>
                <select id="billing">
                  <option>Monthly</option>
                  <option>Yearly</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="title">Business Address</div>
          <div class="fields">
            <div class="form-item">
              <label for="street">Street Address</label>
              <input type="text" id="street" />
            </div>
            <div class="row">
              <div class="form-item">
                <label for="city">City</label>
                <input type="text" id="city" />
              </div>
              <div class="form-item">
                <label for="province">Province</label>
                <select id="province">
                  <option>Ontario</option>
                  <option>Quebec</option>
                  <option>Alberta</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="form-item">
                <label for="zip">ZIP/Postal Code</label>
                <input type="text" id="zip" />
              </div>
              <div class="form-item">
                <label for="country">Country</label>
                <select id="country">
                  <option>Canada</option>
                  <option>USA</option>
                  <option>Azerbaijan</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="title">
            Change Password
            <p>Password must be at least 8 characters.</p>
          </div>
          <div class="fields">
            <div class="row">
              <div class="form-item">
                <label for="password">Password</label>
                <input type="password" id="password" />
              </div>
              <div class="form-item">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" />
              </div>
            </div>
          </div>
        </div>

        <div class="buttons">
          <button type="button" class="cancel">CANCEL</button>
          <button type="button" class="update">UPDATE</button>
        </div>
      </form>
    </div>
  </body>
</html>
